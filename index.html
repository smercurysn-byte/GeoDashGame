import sys
import asyncio
import platform

from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "geodashgame"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/geodashgame
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("geodashgame.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("geodashgame.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

<script>
(function () {
    var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var panel = document.getElementById('touch-controls');
    if (!isTouch || !panel) return;
    panel.classList.add('active');

    var keyCodeMap = {
        ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
        Space: 32, KeyE: 69, Escape: 27
    };

    function fire(type, code, key) {
        var ev = new KeyboardEvent(type, {
            code: code,
            key: key,
            keyCode: keyCodeMap[code],
            which: keyCodeMap[code],
            bubbles: true,
            cancelable: true
        });
        document.dispatchEvent(ev);
        window.dispatchEvent(ev);
    }

    // ── 버튼(대시/힐/나가기) ──
    var buttons = panel.querySelectorAll('.tc-btn');
    buttons.forEach(function (btn) {
        var code = btn.getAttribute('data-code');
        var key = btn.getAttribute('data-key');
        var activeTouchId = null;

        btn.addEventListener('touchstart', function (e) {
            e.preventDefault();
            if (activeTouchId !== null) return;
            var t = e.changedTouches[0];
            activeTouchId = t.identifier;
            btn.classList.add('tc-active');
            fire('keydown', code, key);
        }, { passive: false });

        function release(e) {
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    activeTouchId = null;
                    btn.classList.remove('tc-active');
                    fire('keyup', code, key);
                    break;
                }
            }
        }
        btn.addEventListener('touchend', release, { passive: false });
        btn.addEventListener('touchcancel', release, { passive: false });
    });

    // ── 이동 조이스틱 (8방향, 방향키를 눌렀다 떼는 것으로 흉내) ──
    var joyBase = document.getElementById('tc-joy-base');
    var joyKnob = document.getElementById('tc-joy-knob');
    var joyTouchId = null;
    var joyActiveDirs = [];   // 현재 눌려 있는 것으로 취급되는 방향키들
    var JOY_RADIUS = 65;      // base 반지름(px)
    var JOY_DEADZONE = 0.25;  // 이 비율 미만 기울이면 방향 없음

    function dirsForAngle(deg) {
        // 0deg = 오른쪽, 시계방향(화면 좌표계 기준)
        if (deg > -22.5 && deg <= 22.5)   return ['ArrowRight'];
        if (deg > 22.5 && deg <= 67.5)    return ['ArrowRight', 'ArrowDown'];
        if (deg > 67.5 && deg <= 112.5)   return ['ArrowDown'];
        if (deg > 112.5 && deg <= 157.5)  return ['ArrowDown', 'ArrowLeft'];
        if (deg > 157.5 || deg <= -157.5) return ['ArrowLeft'];
        if (deg > -157.5 && deg <= -112.5) return ['ArrowLeft', 'ArrowUp'];
        if (deg > -112.5 && deg <= -67.5)  return ['ArrowUp'];
        return ['ArrowUp', 'ArrowRight'];
    }

    function setJoyDirs(newDirs) {
        joyActiveDirs.forEach(function (d) {
            if (newDirs.indexOf(d) === -1) fire('keyup', d, d);
        });
        newDirs.forEach(function (d) {
            if (joyActiveDirs.indexOf(d) === -1) fire('keydown', d, d);
        });
        joyActiveDirs = newDirs;
    }

    function updateJoy(clientX, clientY) {
        var rect = joyBase.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var dx = clientX - cx;
        var dy = clientY - cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var clamped = Math.min(dist, JOY_RADIUS);
        var angle = Math.atan2(dy, dx);
        var kx = Math.cos(angle) * clamped;
        var ky = Math.sin(angle) * clamped;
        joyKnob.style.left = (65 + kx) + 'px';
        joyKnob.style.top = (65 + ky) + 'px';
        joyKnob.style.marginLeft = '-28px';
        joyKnob.style.marginTop = '-28px';

        if (dist / JOY_RADIUS < JOY_DEADZONE) {
            setJoyDirs([]);
        } else {
            setJoyDirs(dirsForAngle(angle * 180 / Math.PI));
        }
    }

    function resetJoy() {
        joyKnob.style.left = '50%';
        joyKnob.style.top = '50%';
        joyKnob.style.marginLeft = '-28px';
        joyKnob.style.marginTop = '-28px';
        setJoyDirs([]);
    }

    joyBase.addEventListener('touchstart', function (e) {
        e.preventDefault();
        if (joyTouchId !== null) return;
        var t = e.changedTouches[0];
        joyTouchId = t.identifier;
        updateJoy(t.clientX, t.clientY);
    }, { passive: false });

    joyBase.addEventListener('touchmove', function (e) {
        e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) {
                updateJoy(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                break;
            }
        }
    }, { passive: false });

    function joyRelease(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) {
                joyTouchId = null;
                resetJoy();
                break;
            }
        }
    }
    joyBase.addEventListener('touchend', joyRelease, { passive: false });
    joyBase.addEventListener('touchcancel', joyRelease, { passive: false });
})();
</script>
